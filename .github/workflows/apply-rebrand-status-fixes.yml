name: Apply Sousa Murray Sites coming-soon status

on:
  push:
    branches:
      - rebrand/sousa-murray-corporate-site

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/sousa-murray-corporate-site
          fetch-depth: 0

      - name: Apply approved coming-soon wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Required text not found in {path_name}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_required(
              'src/pages/brands.tsx',
              "  href: string;\n  button: string;\n  alternate?: boolean;\n};",
              "  href?: string;\n  button?: string;\n  alternate?: boolean;\n  comingSoon?: boolean;\n};",
          )
          replace_required(
              'src/pages/brands.tsx',
              "    classification: 'Customer-facing brand of JA Group Services Ltd',\n    icon: Network,\n    accent: 'blue',",
              "    classification: 'Approved forthcoming brand of JA Group Services Ltd',\n    icon: Network,\n    accent: 'blue',\n    comingSoon: true,",
          )
          replace_required(
              'src/pages/brands.tsx',
              "      'Sousa Murray Sites is the dedicated customer-facing brand for Managed Website Services designed, built, configured, maintained or managed directly by JA Group Services Ltd.',\n      'It is separate from the authorised reseller-based domain services presented through Sousa Murray Domains, while both brands remain operated by JA Group Services Ltd.',",
              "      'Sousa Murray Sites is the approved forthcoming brand for Managed Website Services designed, built, configured, maintained or managed directly by JA Group Services Ltd.',\n      'The Sousa Murray Sites website and customer-facing service area are still being built and have not yet launched. It will remain separate from the authorised reseller-based domain services presented through Sousa Murray Domains.',",
          )
          replace_required(
              'src/pages/brands.tsx',
              "    support:\n      'JA Group Services Ltd provides project, website-management, maintenance and customer support for services delivered through Sousa Murray Sites.',\n    href: 'https://sousamurraysites.jagroupservices.co.uk/',\n    button: 'Visit Sousa Murray Sites',",
              "    support:\n      'Customer support and service-access arrangements will be confirmed before Sousa Murray Sites launches. Existing Managed Website Service enquiries remain handled by JA Group Services Ltd.',",
          )
          replace_required(
              'src/pages/brands.tsx',
              "              <h2 className=\"text-3xl font-bold text-foreground sm:text-4xl\">{brand.name}</h2>\n            </div>",
              "              <div className=\"flex flex-wrap items-center gap-3\">\n                <h2 className=\"text-3xl font-bold text-foreground sm:text-4xl\">{brand.name}</h2>\n                {brand.comingSoon && (\n                  <span className=\"rounded-full border border-border bg-secondary px-3 py-1 text-xs font-semibold text-muted-foreground\">\n                    Coming soon\n                  </span>\n                )}\n              </div>\n            </div>",
          )
          replace_required(
              'src/pages/brands.tsx',
              "            <a href={brand.href} target=\"_blank\" rel=\"noopener noreferrer\" className=\"inline-block pt-1\">\n              <Button size=\"lg\" className={`min-h-12 px-7 font-bold ${accentClasses.button}`}>\n                {brand.button}\n                <ExternalLink className=\"ml-2 h-4 w-4\" />\n              </Button>\n            </a>",
              "            {brand.comingSoon ? (\n              <Button type=\"button\" size=\"lg\" variant=\"outline\" disabled className=\"min-h-12 px-7 font-bold\">\n                Coming soon\n              </Button>\n            ) : (\n              <a href={brand.href} target=\"_blank\" rel=\"noopener noreferrer\" className=\"inline-block pt-1\">\n                <Button size=\"lg\" className={`min-h-12 px-7 font-bold ${accentClasses.button}`}>\n                  {brand.button}\n                  <ExternalLink className=\"ml-2 h-4 w-4\" />\n                </Button>\n              </a>\n            )}",
          )

          replace_required(
              'src/layouts/parts/Footer.tsx',
              "              <li>\n                <a href=\"https://sousamurraydomains.jagroupservices.co.uk/\" target=\"_blank\" rel=\"noopener noreferrer\" className={`${linkClass} inline-flex items-center gap-1`}>\n                  Sousa Murray Domains <ExternalLink className=\"h-3 w-3\" />\n                </a>\n              </li>",
              "              <li>\n                <a href=\"https://sousamurraydomains.jagroupservices.co.uk/\" target=\"_blank\" rel=\"noopener noreferrer\" className={`${linkClass} inline-flex items-center gap-1`}>\n                  Sousa Murray Domains <ExternalLink className=\"h-3 w-3\" />\n                </a>\n              </li>\n              <li>\n                <span className={`${linkClass} cursor-default`}>Sousa Murray Sites — Coming soon</span>\n              </li>",
          )

          replace_required(
              'src/pages/sitemap.tsx',
              "      { path: 'https://sousamurraydomains.jagroupservices.co.uk/', label: 'Sousa Murray Domains', icon: Globe, internal: false },",
              "      { path: 'https://sousamurraydomains.jagroupservices.co.uk/', label: 'Sousa Murray Domains', icon: Globe, internal: false },\n      { path: '/about-our-divisions', label: 'Sousa Murray Sites — Coming soon', icon: Globe, internal: true },",
          )

          replace_required(
              'src/pages/services.tsx',
              "          'A fully managed website service for organisations that need a professional online presence without managing the technical work themselves.',",
              "          'A fully managed website service for organisations that need a professional online presence without managing the technical work themselves. The dedicated Sousa Murray Sites website and customer-facing service area are coming soon and have not yet launched.',",
          )

          replace_required(
              'src/pages/terms-of-service.tsx',
              "                      <p className=\"mb-4\">1.3 The Company operates under the trading name \"JA Group Services\" as its primary brand.</p>\n                      <p className=\"mb-4\">1.4 The Company also operates \"Sousa Murray Domains\" as a division and trading name. It forms part of JA Group Services Ltd and does not constitute a separate legal entity.</p>",
              "                      <p className=\"mb-4\">1.3 JA Group Services Ltd remains the legal operating company. Sousa Murray is the Company’s master brand and trading identity.</p>\n                      <p className=\"mb-4\">1.4 The Company operates the customer-facing brands Sousa Murray Domains, Sousa Murray Planeia, Sousa Murray Profiles and Sousa Murray eLearning. Sousa Murray Sites is an approved forthcoming brand and has not yet launched. None of these brands constitutes a separate legal entity or has independent contracting authority.</p>",
          )
          PY

          rm .github/workflows/apply-rebrand-status-fixes.yml

      - name: Commit approved status changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/apply-rebrand-status-fixes.yml
          git commit -m "Mark Sousa Murray Sites as coming soon across corporate site"
          git push origin HEAD:rebrand/sousa-murray-corporate-site
