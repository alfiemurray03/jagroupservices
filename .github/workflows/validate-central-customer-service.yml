name: Validate Central Customer Service

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate customer service contract
        run: node tests/central-customer-service-bridge.test.mjs

      - name: Validate public translations and policies
        run: npm test -- --run src/lib/public-site-content.test.ts

      - name: Type-check website
        run: npm run type-check

      - name: Build production website
        run: npm run build
