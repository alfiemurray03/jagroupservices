<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var consentKey = 'c2_analytics_consent';

        function getCookie(name) {
          var prefix = name + '=';
          var cookie = document.cookie
            .split(';')
            .map(function (item) { return item.trim(); })
            .find(function (item) { return item.indexOf(prefix) === 0; });

          if (!cookie) return null;
          var value = cookie.substring(prefix.length);

          try {
            return decodeURIComponent(value);
          } catch (error) {
            return value;
          }
        }

        function readConsent() {
          var saved = getCookie(consentKey) || localStorage.getItem(consentKey);
          if (!saved) return { functional: false, analytics: false };

          try {
            var parsed = JSON.parse(saved);
            return {
              functional: parsed.functional === true,
              analytics: parsed.analytics === true,
            };
          } catch (error) {
            return { functional: false, analytics: false };
          }
        }

        function loadScript(src, id) {
          if (id && document.getElementById(id)) return;
          var script = document.createElement('script');
          script.async = true;
          script.src = src;
          if (id) script.id = id;
          document.head.appendChild(script);
        }

        var consent = readConsent();

        if (consent.analytics) {
          window.dataLayer = window.dataLayer || [];
          window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-79FS3MK55Y', { anonymize_ip: true });
          loadScript('https://www.googletagmanager.com/gtag/js?id=G-79FS3MK55Y', 'google-analytics-tag');
        }

        if (consent.functional) {
          loadScript('//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js', 'trustpilot-widget-script');

          window.TrustpilotObject = 'tp';
          window.tp = window.tp || function () {
            (window.tp.q = window.tp.q || []).push(arguments);
          };
          loadScript('https://invitejs.trustpilot.com/tp.min.js', 'trustpilot-invitation-script');
          window.tp('register', 'X9yj5o97kVRIPTnT');
        }
      })();
    </script>

    <title>JA Group Services</title>

    <script>
      (function () {
        try {
          var preference = localStorage.getItem('ja-group-services-theme') || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = preference === 'dark' || (preference === 'system' && systemDark);
          document.documentElement.classList.toggle('dark', useDark);
          document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <!-- Animated Favicon -->
    <script>
      // Favicon animation - subtle pulse effect
      let faviconPulse = 0;
      let pulseDirection = 1;

      function animateFavicon() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = '/images/367f316379e78929865b1677b6370686.jpg';

        img.onload = function() {
          setInterval(() => {
            // Clear canvas
            ctx.clearRect(0, 0, 64, 64);

            // Update pulse
            faviconPulse += pulseDirection * 0.02;
            if (faviconPulse >= 1) pulseDirection = -1;
            if (faviconPulse <= 0) pulseDirection = 1;

            // Calculate scale with subtle pulse (0.95 to 1.05)
            const scale = 0.95 + (faviconPulse * 0.1);
            const offset = (64 - (64 * scale)) / 2;

            // Draw image with scale
            ctx.drawImage(img, offset, offset, 64 * scale, 64 * scale);

            // Update favicon
            const favicon = document.getElementById('favicon');
            if (favicon) {
              favicon.href = canvas.toDataURL('image/png');
            }
          }, 50); // 20 FPS for smooth animation
        };
      }

      // Start animation when page loads
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', animateFavicon);
      } else {
        animateFavicon();
      }
    </script>
  </body>
</html>
